spring:
  application:
    name: xiaoying-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xiaoying}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:xiaoying}
    password: ${DB_PASSWORD:xiaoying}
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  web:
    resources:
      # 关闭默认的 /** 静态资源映射，素材只通过 WebConfig 中的 /api/files/** 访问，未知路径返回 JSON 404
      add-mappings: false
  servlet:
    multipart:
      # 全局上限，略大于模板中最大的 maxFileSizeBytes（10MB）。按模板的上限在 AssetService 中校验
      max-file-size: 11MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # 超过上限时 Tomcat 继续读完请求体再返回 413，而不是直接断开连接
    max-swallow-size: 20MB

app:
  storage:
    dir: ${STORAGE_DIR:./data}
  executor:
    # 线程池只在队列满后才会超出核心线程数，所以同时执行的任务数实际由 core-size 决定。
    # core-size 与 max-size 取相同值，最多同时执行 4 个任务，其余在队列中排队。
    core-size: ${EXECUTOR_CORE_SIZE:4}
    max-size: ${EXECUTOR_MAX_SIZE:4}
    queue-capacity: ${EXECUTOR_QUEUE_CAPACITY:100}
  # 模拟生成器的启动默认值；运行时可通过 /api/dev/simulation 修改
  simulation:
    check-assets-ms: ${SIM_CHECK_ASSETS_MS:1000}
    generate-ms: ${SIM_GENERATE_MS:3000}
    organize-result-ms: ${SIM_ORGANIZE_RESULT_MS:1000}
    # NONE / CHECK_ASSETS / GENERATE / ORGANIZE_RESULT
    fail-stage: ${SIM_FAIL_STAGE:NONE}
  dev-api:
    # 开放 /api/dev/simulation。Compose 中为演示方便默认开启，正式部署应关闭
    enabled: ${DEV_API_ENABLED:false}
  identity:
    cookie-name: uid
    cookie-max-age: 365d
    # 部署到 https 时设为 true
    cookie-secure: ${COOKIE_SECURE:false}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
