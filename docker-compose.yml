# 启动：docker compose up --build    访问：http://localhost:3000
# 配置项见 .env.example，复制为 .env 后修改；不建 .env 时使用下面的默认值。

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-xiaoying}
      MYSQL_USER: ${DB_USER:-xiaoying}
      MYSQL_PASSWORD: ${DB_PASSWORD:-xiaoying}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-xiaoying}
      DB_USER: ${DB_USER:-xiaoying}
      DB_PASSWORD: ${DB_PASSWORD:-xiaoying}
      STORAGE_DIR: /data
      # 部署到 https 时设为 true，身份 cookie 加 Secure
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 演示用：开放 /api/dev/simulation，可调整耗时、指定失败阶段
      DEV_API_ENABLED: ${DEV_API_ENABLED:-true}
      SIM_CHECK_ASSETS_MS: ${SIM_CHECK_ASSETS_MS:-1000}
      SIM_GENERATE_MS: ${SIM_GENERATE_MS:-3000}
      SIM_ORGANIZE_RESULT_MS: ${SIM_ORGANIZE_RESULT_MS:-1000}
      SIM_FAIL_STAGE: ${SIM_FAIL_STAGE:-NONE}
    volumes:
      # 上传的素材和生成的结果图，容器重建后保留
      - backend-data:/data
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # JRE 镜像不带 curl，用 bash 的 /dev/tcp 检查端口
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /api/health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  backend-data:
